# NAO TESTADO: nunca executado (sem Docker na maquina de desenvolvimento).
#
# O Postgres e o Auth vem do Supabase gerenciado, entao nao ha servico de banco
# aqui: sao apenas os dois processos da aplicacao.
services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file:
      - ../apps/api/.env
    ports:
      - '3333:3333'
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    ports:
      - '3000:3000'
    restart: unless-stopped
