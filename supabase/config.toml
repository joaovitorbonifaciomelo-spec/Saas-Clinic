# Configuracao minima do Supabase CLI. O desenvolvimento usa um projeto
# gerenciado (supabase link + db push), nao a stack local via Docker.
project_id = "clinicas-saas"

[db]
# Precisa espelhar o postgres_engine do projeto remoto (Settings -> Database).
# Divergencia aqui faz o CLI reclamar no link e no push.
major_version = 17
